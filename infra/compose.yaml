# Tools are public; personal configurations require a verified account.
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      SNACKPRESS_PUBLIC_URL: ${SNACKPRESS_PUBLIC_URL:-http://127.0.0.1:8080}
      SNACKPRESS_MAIL_MODE: ${SNACKPRESS_MAIL_MODE:-smtp}
      SNACKPRESS_MAIL_FROM: ${SNACKPRESS_MAIL_FROM:-}
      SNACKPRESS_SMTP_HOST: ${SNACKPRESS_SMTP_HOST:-}
      SNACKPRESS_SMTP_PORT: ${SNACKPRESS_SMTP_PORT:-587}
      SNACKPRESS_SMTP_SECURITY: ${SNACKPRESS_SMTP_SECURITY:-starttls}
      SNACKPRESS_SMTP_USERNAME: ${SNACKPRESS_SMTP_USERNAME:-}
      SNACKPRESS_SMTP_PASSWORD: ${SNACKPRESS_SMTP_PASSWORD:-}
    volumes:
      - pdf-data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 1536m
    cpus: 2
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - '127.0.0.1:${SNACKPRESS_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=1m,mode=1777
      - /data:size=1m,mode=1777
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
volumes:
  pdf-data:
