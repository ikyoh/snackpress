[project]
name = "snackpress"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pikepdf==9.11.0",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "reportlab>=4.4,<5",
  "pypdfium2>=4.30,<6",
  "numpy>=2.0,<3",
  "shapely>=2.1,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/imposition", "packages/prepress"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.uv]
package = false
